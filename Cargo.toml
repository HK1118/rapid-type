[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"]}
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
